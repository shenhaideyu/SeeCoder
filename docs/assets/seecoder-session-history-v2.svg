<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder Session、事件与分支</title>
  <desc id="desc">父 Session 保存完整事件，子 Session 记录父引用、分叉位置和新增事件，读取时组合历史。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#70488d"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#239474"/></marker>
  </defs>
  <rect width="1200" height="540" rx="28" fill="#faf9fc"/>
  <text x="40" y="43" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">Session 保存长期历史，Turn 表示一次请求</text>
  <text x="40" y="71" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">分支保存父引用和新增事件，不复制整份 JSONL</text>

  <rect x="45" y="112" width="155" height="72" rx="15" fill="#fff" stroke="#d8cfdf" stroke-width="2"/>
  <text x="122" y="143" text-anchor="middle" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Workspace</text>
  <text x="122" y="165" text-anchor="middle" fill="#867b8d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">同一份本地文件</text>
  <path d="M200 148H258" fill="none" stroke="#70488d" stroke-width="2.8" marker-end="url(#arrow)"/>
  <rect x="270" y="112" width="170" height="72" rx="15" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/>
  <text x="355" y="143" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">父 Session</text>
  <text x="355" y="165" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">独立事件流与状态</text>

  <path d="M440 148H488" fill="none" stroke="#70488d" stroke-width="2.8" marker-end="url(#arrow)"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="500" y="112" width="100" height="72" rx="14" fill="#eef6ff" stroke="#8bb9df"/><text x="550" y="143" text-anchor="middle" fill="#285378" font-size="15" font-weight="700">E1</text><text x="550" y="165" text-anchor="middle" fill="#61788c" font-size="11">用户消息</text>
    <path d="M600 148H638" fill="none" stroke="#70488d" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="650" y="112" width="100" height="72" rx="14" fill="#eef6ff" stroke="#8bb9df"/><text x="700" y="143" text-anchor="middle" fill="#285378" font-size="15" font-weight="700">E2</text><text x="700" y="165" text-anchor="middle" fill="#61788c" font-size="11">工具结果</text>
    <path d="M750 148H788" fill="none" stroke="#70488d" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="800" y="112" width="100" height="72" rx="14" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/><text x="850" y="143" text-anchor="middle" fill="#6a5014" font-size="15" font-weight="700">E3</text><text x="850" y="165" text-anchor="middle" fill="#887344" font-size="11">分叉位置</text>
    <path d="M900 148H938" fill="none" stroke="#70488d" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="950" y="112" width="90" height="72" rx="14" fill="#eef6ff" stroke="#8bb9df"/><text x="995" y="143" text-anchor="middle" fill="#285378" font-size="15" font-weight="700">E4</text><text x="995" y="165" text-anchor="middle" fill="#61788c" font-size="11">父增量</text>
    <path d="M1040 148H1068" fill="none" stroke="#70488d" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="1080" y="112" width="80" height="72" rx="14" fill="#eef6ff" stroke="#8bb9df"/><text x="1120" y="143" text-anchor="middle" fill="#285378" font-size="15" font-weight="700">E5</text><text x="1120" y="165" text-anchor="middle" fill="#61788c" font-size="11">父增量</text>
  </g>

  <path d="M850 184V226L780 266" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="500" y="278" width="270" height="86" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="635" y="307" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">子 Session 元数据</text>
  <text x="635" y="332" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">parentSessionId = 父 Session</text>
  <text x="635" y="351" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">forkedFromSeq = E3</text>
  <path d="M770 321H828" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="840" y="278" width="100" height="86" rx="15" fill="#fff" stroke="#79c7b2"/><text x="890" y="313" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">E4'</text><text x="890" y="339" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">子增量</text>
  <path d="M940 321H978" fill="none" stroke="#239474" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
  <rect x="990" y="278" width="100" height="86" rx="15" fill="#fff" stroke="#79c7b2"/><text x="1040" y="313" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">E5'</text><text x="1040" y="339" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">子增量</text>

  <path d="M635 364V410H470V432" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1040 364V410H730V432" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="540" y="402" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">父前缀 E1–E3</text>
  <text x="865" y="402" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">子增量 E4'–E5'</text>
  <rect x="310" y="444" width="580" height="66" rx="17" fill="#fff" stroke="#b685dd" stroke-width="2"/>
  <text x="600" y="472" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">读取子分支：父前缀 E1–E3 + 子增量 E4'–E5'</text>
  <text x="600" y="495" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">父分支后来的 E4、E5 不会进入子分支</text>
</svg>
