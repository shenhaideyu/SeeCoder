<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 模型输出解析</title>
  <desc id="desc">ModelProvider 将流式响应解析成文本和 Tool Call，完成聚合与校验后交给 AgentCore。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="45" y="115" width="190" height="120" rx="21" fill="#eef5ff" stroke="#79a9ed" stroke-width="2" filter="url(#shadow)"/>
    <text x="140" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#243a63">ModelProvider</text><text x="140" y="200" text-anchor="middle" font-size="16" fill="#5d6980">接收模型流</text>
    <path d="M235 175H285" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="295" y="115" width="180" height="120" rx="21" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="385" y="165" text-anchor="middle" font-size="23" font-weight="700" fill="#241b2b">SSE 解析</text><text x="385" y="200" text-anchor="middle" font-size="16" fill="#746d79">连续事件</text>
    <path d="M475 175H525" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="535" y="65" width="190" height="100" rx="20" fill="#f0e7fa" stroke="#b38add" stroke-width="2"/>
    <text x="630" y="108" text-anchor="middle" font-size="22" font-weight="700" fill="#4d0099">文本增量</text><text x="630" y="138" text-anchor="middle" font-size="15" fill="#675774">实时显示</text>
    <rect x="535" y="205" width="190" height="100" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2"/>
    <text x="630" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4119">Tool Call</text><text x="630" y="278" text-anchor="middle" font-size="15" fill="#725d3b">按 callId 聚合</text>
    <path d="M725 255H785" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="795" y="205" width="180" height="100" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="885" y="248" text-anchor="middle" font-size="22" font-weight="700" fill="#241b2b">完整校验</text><text x="885" y="278" text-anchor="middle" font-size="15" fill="#746d79">名称与参数</text>
    <path d="M725 115H1005V175" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M975 255H1005V205" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="1015" y="115" width="145" height="120" rx="21" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="1087" y="165" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">AgentCore</text><text x="1087" y="200" text-anchor="middle" font-size="15" fill="#f4eefe">统一事件</text>
    <rect x="340" y="335" width="520" height="38" rx="19" fill="#edf8f4" stroke="#63b89b"/>
    <text x="600" y="360" text-anchor="middle" font-size="15" fill="#185b49">未完整结束的 Tool Call 不会进入本地执行</text>
  </g>
</svg>
