<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 系统架构</title>
  <desc id="desc">Renderer 通过 Preload 与 Electron Main 通信，AgentCore 在可信主进程内协调模型、工具和会话存储。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#32104f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="45" y="90" width="220" height="300" rx="26" fill="#fff" stroke="#d9c9e8" stroke-width="2" filter="url(#shadow)"/>
    <text x="155" y="155" text-anchor="middle" font-size="27" font-weight="700" fill="#241b2b">Renderer</text>
    <text x="155" y="205" text-anchor="middle" font-size="18" fill="#746d79">对话与计划</text><text x="155" y="240" text-anchor="middle" font-size="18" fill="#746d79">审批与 Diff</text><text x="155" y="275" text-anchor="middle" font-size="18" fill="#746d79">终端与轨迹</text>
    <rect x="82" y="320" width="146" height="42" rx="21" fill="#f0e7fa"/><text x="155" y="347" text-anchor="middle" font-size="15" fill="#4d0099">无本地执行权限</text>

    <path d="M265 240H335" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="345" y="155" width="150" height="170" rx="22" fill="#fff" stroke="#b38add" stroke-width="2" filter="url(#shadow)"/>
    <text x="420" y="220" text-anchor="middle" font-size="25" font-weight="700" fill="#4d0099">Preload</text><text x="420" y="258" text-anchor="middle" font-size="17" fill="#746d79">类型化 IPC</text><text x="420" y="288" text-anchor="middle" font-size="15" fill="#746d79">最小能力桥</text>
    <path d="M495 240H555" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="565" y="45" width="590" height="390" rx="30" fill="#fcfaff" stroke="#4d0099" stroke-width="3" filter="url(#shadow)"/>
    <text x="860" y="92" text-anchor="middle" font-size="26" font-weight="700" fill="#4d0099">Electron Main · 可信执行边界</text>
    <rect x="620" y="120" width="480" height="100" rx="22" fill="url(#brand)"/>
    <text x="860" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#fff">AgentCore</text><text x="860" y="200" text-anchor="middle" font-size="16" fill="#f4eefe">状态机与任务闭环</text>
    <rect x="610" y="270" width="150" height="105" rx="19" fill="#eef5ff" stroke="#79a9ed" stroke-width="2"/><text x="685" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#243a63">ModelProvider</text><text x="685" y="345" text-anchor="middle" font-size="15" fill="#5d6980">模型访问</text>
    <rect x="785" y="270" width="150" height="105" rx="19" fill="#fff8e8" stroke="#e5ad45" stroke-width="2"/><text x="860" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#5c4119">ToolRuntime</text><text x="860" y="345" text-anchor="middle" font-size="15" fill="#725d3b">本地工具</text>
    <rect x="960" y="270" width="150" height="105" rx="19" fill="#edf8f4" stroke="#63b89b" stroke-width="2"/><text x="1035" y="315" text-anchor="middle" font-size="20" font-weight="700" fill="#185b49">SessionStore</text><text x="1035" y="345" text-anchor="middle" font-size="15" fill="#477366">事件与恢复</text>
    <path d="M685 270V235H860V220" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M860 270V220" stroke="#7c3aed" stroke-width="2.5"/>
    <path d="M1035 270V235H860" fill="none" stroke="#7c3aed" stroke-width="2.5"/>
  </g>
</svg>
