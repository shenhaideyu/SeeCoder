<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 单次任务时序</title>
  <desc id="desc">Renderer、AgentCore、TurnRunner、ModelProvider 和 ToolCallExecutor 之间从用户输入到最终事件的调用顺序。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#70488d"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#239474"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#faf9fc"/>
  <text x="40" y="42" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">一次任务从输入到完成</text>
  <text x="40" y="70" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">Assistant Tool Calls 与 Tool Result 始终按 callId 成组保存</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="35" y="95" width="170" height="56" rx="13" fill="#fff" stroke="#d8cfdf" stroke-width="2"/><text x="120" y="130" text-anchor="middle" fill="#251d2b" font-size="16" font-weight="700">Renderer</text>
    <rect x="270" y="95" width="170" height="56" rx="13" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="355" y="130" text-anchor="middle" fill="#4d176f" font-size="16" font-weight="700">AgentCore</text>
    <rect x="505" y="95" width="170" height="56" rx="13" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="590" y="130" text-anchor="middle" fill="#4d176f" font-size="16" font-weight="700">TurnRunner</text>
    <rect x="740" y="95" width="170" height="56" rx="13" fill="#eef6ff" stroke="#8bb9df" stroke-width="2"/><text x="825" y="130" text-anchor="middle" fill="#285378" font-size="16" font-weight="700">ModelProvider</text>
    <rect x="975" y="95" width="190" height="56" rx="13" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/><text x="1070" y="130" text-anchor="middle" fill="#6a5014" font-size="16" font-weight="700">ToolCallExecutor</text>
  </g>

  <g stroke="#cfc5d6" stroke-width="1.5" stroke-dasharray="7 7">
    <path d="M120 151V520"/><path d="M355 151V520"/><path d="M590 151V520"/><path d="M825 151V520"/><path d="M1070 151V520"/>
  </g>

  <g fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M120 190H343"/>
    <path d="M355 235H578"/>
    <path d="M590 280H813"/>
    <path d="M825 325H602"/>
    <path d="M590 370H1058"/>
  </g>
  <g fill="#4f4456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">
    <text x="232" y="181" text-anchor="middle">1. 用户目标经 IPC 进入 Main</text>
    <text x="467" y="226" text-anchor="middle">2. 创建 Turn 并启动状态机</text>
    <text x="702" y="271" text-anchor="middle">3. 发送系统规则、上下文和工具 Schema</text>
    <text x="702" y="316" text-anchor="middle">4. 文本增量与 Tool Call 分片</text>
    <text x="830" y="361" text-anchor="middle">5. 校验、审批、Hook、本地执行</text>
  </g>

  <path d="M1070 414H602" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <text x="835" y="405" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">6. ToolResult 压缩为 Observation，进入下一轮</text>

  <path d="M590 460H367" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M355 495H132" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="478" y="451" text-anchor="middle" fill="#4f4456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">7. 形成唯一 Turn 终态</text>
  <text x="245" y="486" text-anchor="middle" fill="#4f4456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">8. 持久化事件并更新界面</text>

  <rect x="470" y="525" width="260" height="27" rx="9" fill="#edf8f5" stroke="#9bd0c0"/>
  <text x="600" y="544" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">循环只重复第 3 至第 6 步</text>
</svg>
