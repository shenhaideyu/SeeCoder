<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder Agent 主循环</title>
  <desc id="desc">AgentCore 重复执行上下文构建、模型调用、输出解析、工具执行和结果反馈，并在明确条件下结束。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="470" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="55" y="85" width="180" height="100" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2" filter="url(#shadow)"/>
    <text x="145" y="130" text-anchor="middle" font-size="22" font-weight="700" fill="#241b2b">用户目标</text><text x="145" y="160" text-anchor="middle" font-size="15" fill="#746d79">开始 Turn</text>
    <path d="M235 135H285" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="295" y="85" width="190" height="100" rx="20" fill="#f0e7fa" stroke="#b38add" stroke-width="2"/>
    <text x="390" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#4d0099">构建上下文</text><text x="390" y="160" text-anchor="middle" font-size="15" fill="#675774">ContextBuilder</text>
    <path d="M485 135H535" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="545" y="85" width="190" height="100" rx="20" fill="#eef5ff" stroke="#79a9ed" stroke-width="2"/>
    <text x="640" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#243a63">调用模型</text><text x="640" y="160" text-anchor="middle" font-size="15" fill="#5d6980">ModelProvider</text>
    <path d="M735 135H785" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="795" y="85" width="170" height="100" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="880" y="130" text-anchor="middle" font-size="21" font-weight="700" fill="#241b2b">解析输出</text><text x="880" y="160" text-anchor="middle" font-size="15" fill="#746d79">文本 / Tool Call</text>

    <path d="M880 185V235" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M880 245L1010 325L880 405L750 325Z" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="880" y="318" text-anchor="middle" font-size="21" font-weight="700" fill="#4d0099">需要工具？</text><text x="880" y="348" text-anchor="middle" font-size="15" fill="#746d79">并检查终止条件</text>

    <path d="M750 325H640" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="700" y="310" text-anchor="middle" font-size="15" fill="#675774">是</text>
    <rect x="435" y="270" width="195" height="110" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2" filter="url(#shadow)"/>
    <text x="532" y="318" text-anchor="middle" font-size="21" font-weight="700" fill="#5c4119">执行工具</text><text x="532" y="350" text-anchor="middle" font-size="15" fill="#725d3b">ToolRuntime</text>
    <path d="M435 325H280" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="80" y="270" width="190" height="110" rx="20" fill="#edf8f4" stroke="#63b89b" stroke-width="2" filter="url(#shadow)"/>
    <text x="175" y="318" text-anchor="middle" font-size="21" font-weight="700" fill="#185b49">Observation</text><text x="175" y="350" text-anchor="middle" font-size="15" fill="#477366">结果返回下一轮</text>
    <path d="M175 270V225H390V195" fill="none" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M1010 325H1095" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="1050" y="310" text-anchor="middle" font-size="15" fill="#675774">否</text>
    <rect x="1095" y="275" width="80" height="100" rx="20" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="1135" y="318" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">结束</text><text x="1135" y="347" text-anchor="middle" font-size="14" fill="#f4eefe">终态</text>
  </g>
</svg>
