<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 系统组件架构</title>
  <desc id="desc">Renderer 通过 Preload 进入 Electron Main。AgentCore 装配 TurnRunner、Context、ToolCallExecutor 和 SessionLifecycle，并连接模型、工具、变更管理与存储。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#35134f" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5L0 10Z" fill="#70488d"/></marker>
  </defs>
  <rect width="1200" height="680" rx="28" fill="#faf9fc"/>
  <text x="40" y="44" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">模块职责与依赖方向</text>
  <text x="40" y="72" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">上层只依赖下层公开接口；Renderer 不能越过 IPC 直接访问本地能力</text>

  <rect x="55" y="105" width="190" height="82" rx="16" fill="#fff" stroke="#d8cfdf" stroke-width="2" filter="url(#shadow)"/>
  <text x="150" y="140" text-anchor="middle" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">React Renderer</text>
  <text x="150" y="164" text-anchor="middle" fill="#867b8d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">页面、输入、事件投影</text>
  <path d="M245 146H313" fill="none" stroke="#70488d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="325" y="105" width="170" height="82" rx="16" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="410" y="140" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">Preload</text>
  <text x="410" y="164" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">固定、类型化 IPC</text>
  <path d="M495 146H563" fill="none" stroke="#70488d" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="575" y="92" width="570" height="118" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="860" y="120" text-anchor="middle" fill="#5d0cae" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">Electron Main · 可信执行边界</text>
  <rect x="705" y="137" width="310" height="55" rx="14" fill="url(#brand)"/>
  <text x="860" y="161" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20" font-weight="700">AgentCore</text>
  <text x="860" y="181" text-anchor="middle" fill="#eadcff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">统一入口、依赖装配、事件广播</text>

  <path d="M860 192V245H145V277" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M860 192V245H430V277" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M860 192V277" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M860 192V245H1090V277" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="35" y="290" width="220" height="100" rx="17" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/>
  <text x="145" y="326" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">TurnRunner</text>
  <text x="145" y="351" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Turn 状态机与 Agent 循环</text>
  <text x="145" y="372" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">终止、取消、动态干预</text>

  <rect x="320" y="290" width="220" height="100" rx="17" fill="#eef6ff" stroke="#8bb9df" stroke-width="2"/>
  <text x="430" y="326" text-anchor="middle" fill="#285378" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">Context</text>
  <text x="430" y="351" text-anchor="middle" fill="#61788c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Ledger、Evidence、Memory</text>
  <text x="430" y="372" text-anchor="middle" fill="#61788c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Observation 与语义压缩</text>

  <rect x="750" y="290" width="220" height="100" rx="17" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/>
  <text x="860" y="326" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">ToolCallExecutor</text>
  <text x="860" y="351" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">校验、审批、Hook、执行</text>
  <text x="860" y="372" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">幂等、并行与结构化收尾</text>

  <rect x="990" y="290" width="185" height="100" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="1082" y="326" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">SessionLifecycle</text>
  <text x="1082" y="351" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">创建、回放、Fork</text>
  <text x="1082" y="372" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Rewind 与状态重建</text>

  <path d="M145 390V465" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M430 390V465" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M860 390V430H720V465" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M860 390V430H930V465" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <path d="M1082 390V465" fill="none" stroke="#70488d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <rect x="45" y="478" width="200" height="82" rx="15" fill="#fff" stroke="#8bb9df" stroke-width="2"/>
  <text x="145" y="512" text-anchor="middle" fill="#285378" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ModelProvider</text>
  <text x="145" y="537" text-anchor="middle" fill="#61788c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">HTTP、SSE、Tool Call 聚合</text>
  <rect x="330" y="478" width="200" height="82" rx="15" fill="#fff" stroke="#8bb9df" stroke-width="2"/>
  <text x="430" y="512" text-anchor="middle" fill="#285378" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Context State</text>
  <text x="430" y="537" text-anchor="middle" fill="#61788c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">权威状态与派生索引</text>
  <rect x="620" y="478" width="200" height="82" rx="15" fill="#fff" stroke="#e0bd5d" stroke-width="2"/>
  <text x="720" y="512" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Tools 与 Policy</text>
  <text x="720" y="537" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">本地能力和工作区边界</text>
  <rect x="840" y="478" width="180" height="82" rx="15" fill="#fff" stroke="#c69de5" stroke-width="2"/>
  <text x="930" y="512" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ChangeManager</text>
  <text x="930" y="537" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">变更、快照与恢复点</text>
  <rect x="1035" y="478" width="140" height="82" rx="15" fill="#fff" stroke="#79c7b2" stroke-width="2"/>
  <text x="1105" y="512" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">SessionStore</text>
  <text x="1105" y="537" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">JSONL 与快照</text>

  <rect x="250" y="604" width="700" height="42" rx="13" fill="#f4edfb" stroke="#d5bee9"/>
  <text x="600" y="630" text-anchor="middle" fill="#5e476c" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Protocol 统一 Session、Turn、Item、AgentEvent、ModelMessage、ToolCall 与 ToolResult</text>
</svg>
