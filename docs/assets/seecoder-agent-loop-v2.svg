<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder Agent 主循环</title>
  <desc id="desc">TurnRunner 检查干预，构建上下文，调用模型，解析输出，执行工具并反馈 Observation，直到进入终态。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#70488d"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#239474"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#c84b62"/></marker>
  </defs>
  <rect width="1200" height="560" rx="28" fill="#faf9fc"/>
  <text x="40" y="43" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">TurnRunner：一轮一轮推进，条件满足才停止</text>
  <text x="40" y="71" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">每轮都重新使用最新任务状态，不让模型直接控制循环</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="35" y="155" width="155" height="76" rx="16" fill="#fff" stroke="#d8cfdf" stroke-width="2"/><text x="112" y="185" text-anchor="middle" fill="#251d2b" font-size="16" font-weight="700">开始 Turn</text><text x="112" y="209" text-anchor="middle" fill="#867b8d" font-size="12">queued → running</text>
    <rect x="245" y="155" width="170" height="76" rx="16" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="330" y="185" text-anchor="middle" fill="#4d176f" font-size="16" font-weight="700">检查控制信号</text><text x="330" y="209" text-anchor="middle" fill="#796488" font-size="12">取消、Steering、预算</text>
    <rect x="470" y="155" width="170" height="76" rx="16" fill="#eef6ff" stroke="#8bb9df" stroke-width="2"/><text x="555" y="185" text-anchor="middle" fill="#285378" font-size="16" font-weight="700">构建上下文</text><text x="555" y="209" text-anchor="middle" fill="#61788c" font-size="12">buildHybridContext</text>
    <rect x="695" y="155" width="170" height="76" rx="16" fill="#eef6ff" stroke="#8bb9df" stroke-width="2"/><text x="780" y="185" text-anchor="middle" fill="#285378" font-size="16" font-weight="700">调用模型</text><text x="780" y="209" text-anchor="middle" fill="#61788c" font-size="12">流式 ModelEvent</text>
    <rect x="920" y="155" width="205" height="76" rx="16" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="1022" y="185" text-anchor="middle" fill="#4d176f" font-size="16" font-weight="700">解析完整响应</text><text x="1022" y="209" text-anchor="middle" fill="#796488" font-size="12">文本、Tool Calls、usage</text>
  </g>
  <path d="M190 193H233" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M415 193H458" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M640 193H683" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M865 193H908" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>

  <path d="M1022 231V280" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M1022 292L1135 360L1022 428L909 360Z" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="1022" y="354" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">需要继续？</text>
  <text x="1022" y="378" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">工具、完成、取消、错误</text>

  <path d="M909 360H760" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <text x="835" y="348" text-anchor="middle" fill="#5d0cae" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">有 Tool Calls</text>
  <rect x="515" y="320" width="235" height="80" rx="17" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/>
  <text x="632" y="352" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ToolCallExecutor</text>
  <text x="632" y="377" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">执行整批调用并返回 ToolResult</text>

  <path d="M515 360H360" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="125" y="320" width="225" height="80" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="237" y="352" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Observation</text>
  <text x="237" y="377" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">把结果反馈给下一轮模型</text>
  <path d="M237 320V270H555V243" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>

  <path d="M1135 360H1168V486H1137" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <text x="1138" y="346" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">完成</text>
  <rect x="880" y="450" width="245" height="72" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="1002" y="479" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">completed</text>
  <text x="1002" y="502" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">发布最终消息和终态事件</text>

  <path d="M965 394L822 486" fill="none" stroke="#c84b62" stroke-width="2.7" marker-end="url(#arrowRed)"/>
  <text x="866" y="430" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">停止</text>
  <rect x="560" y="450" width="250" height="72" rx="17" fill="#fff2f4" stroke="#d96b7f" stroke-width="2"/>
  <text x="685" y="479" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">其他终态</text>
  <text x="685" y="502" text-anchor="middle" fill="#99606b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">failed / cancelled / limitReached</text>
</svg>
