<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 终止条件与错误处理</title>
  <desc id="desc">每轮由 AgentCore 判断继续、完成、恢复或终止，并保证只发布一次明确终态。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="55" y="150" width="190" height="120" rx="22" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="150" y="200" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">AgentCore</text><text x="150" y="237" text-anchor="middle" font-size="16" fill="#f4eefe">每轮判断状态</text>
    <path d="M245 210H330" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M350 120L500 210L350 300L200 210Z" transform="translate(150 0)" fill="#fff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
    <text x="500" y="202" text-anchor="middle" font-size="22" font-weight="700" fill="#4d0099">本轮结果</text><text x="500" y="235" text-anchor="middle" font-size="15" fill="#746d79">继续还是结束？</text>

    <path d="M500 120V72H735" fill="none" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="745" y="35" width="400" height="82" rx="20" fill="#edf8f4" stroke="#63b89b" stroke-width="2"/>
    <text x="945" y="70" text-anchor="middle" font-size="21" font-weight="700" fill="#185b49">完成</text><text x="945" y="97" text-anchor="middle" font-size="15" fill="#477366">目标满足并记录验证状态</text>

    <path d="M650 210H735" stroke="#e5ad45" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="745" y="165" width="400" height="90" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2"/>
    <text x="945" y="202" text-anchor="middle" font-size="21" font-weight="700" fill="#5c4119">可恢复错误</text><text x="945" y="232" text-anchor="middle" font-size="15" fill="#725d3b">结构化反馈模型，允许调整方案</text>
    <path d="M745 230H690V345H500V310" fill="none" stroke="#e5ad45" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>

    <path d="M500 300V345H735" fill="none" stroke="#d25565" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="745" y="305" width="400" height="100" rx="20" fill="#fff1f2" stroke="#e46a78" stroke-width="2"/>
    <text x="945" y="345" text-anchor="middle" font-size="21" font-weight="700" fill="#9c2635">终止</text><text x="945" y="375" text-anchor="middle" font-size="15" fill="#8a5360">不可恢复错误 · 用户取消 · 迭代上限</text>

    <rect x="55" y="345" width="410" height="60" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="260" y="382" text-anchor="middle" font-size="16" fill="#746d79">统一清理请求、审批和子进程；终态只发布一次</text>
  </g>
</svg>
