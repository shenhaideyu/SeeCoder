<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 终止条件与错误处理决策图</title>
  <desc id="desc">展示 Turn 在运行中如何根据取消、模型输出、工具结果、无进展计数和 24 轮上限进入 completed、failed、cancelled 或 limitReached，并说明可恢复工具错误不会自动终止整个任务。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8247d6"/><stop offset="1" stop-color="#4d0099"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#4d0099" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#716777"/></marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4d0099"/></marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#d94b64"/></marker>
    <style>
      .pageTitle{font:700 34px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#242027}.pageSubtitle{font:400 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#746d79}
      .section{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4d0099}.title{font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#342b3c}.body{font:400 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#675e6e}.strong{font:600 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#493f50}.meta{font:500 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#817688}.mono{font:500 12px Consolas,'Microsoft YaHei',monospace;fill:#62596a}
      .node{fill:#fff;stroke:#cdb7e1;stroke-width:1.7;filter:url(#shadow)}.decision{fill:#f7f1fc;stroke:#8247d6;stroke-width:1.8}.recover{fill:#fff8eb;stroke:#e5b86f;stroke-width:1.6}.observe{fill:#eef5fc;stroke:#9bbfe7;stroke-width:1.6}.complete{fill:#eef9f5;stroke:#78c8ad;stroke-width:1.8}.failed{fill:#fff3f5;stroke:#ef8fa0;stroke-width:1.8}.limit{fill:#fff7eb;stroke:#dca657;stroke-width:1.8}.cancel{fill:#f3f1f4;stroke:#aaa1ae;stroke-width:1.8}.card{fill:#fff;stroke:#e2dce6;stroke-width:1.4;filter:url(#shadow)}
      .edge{fill:none;stroke:#716777;stroke-width:2;marker-end:url(#arrow)}.purpleEdge{fill:none;stroke:#4d0099;stroke-width:2.2;marker-end:url(#arrowPurple)}.redEdge{fill:none;stroke:#d94b64;stroke-width:2.1;marker-end:url(#arrowRed)}.dashEdge{fill:none;stroke:#8d8295;stroke-width:1.8;stroke-dasharray:7 6;marker-end:url(#arrow)}
      .label{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4d0099}.labelRed{font:700 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#c73d57}.center{text-anchor:middle}.white{fill:#fff}.badge{font:700 11px 'Segoe UI','Microsoft YaHei',sans-serif;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>

  <rect width="1600" height="1100" fill="#f6f6f7"/>
  <text x="48" y="56" class="pageTitle">09 · 终止条件与错误处理</text>
  <text x="48" y="86" class="pageSubtitle">终止由 Agent Core 的硬规则决定；Prompt 只帮助模型收敛，不能代替状态机、计数器与 AbortSignal</text>

  <!-- Main decision area -->
  <rect x="38" y="116" width="1090" height="850" rx="24" fill="#fbf9fd" stroke="#d8cce6" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="58" y="134" width="156" height="34" rx="17" fill="#f0e7fa"/><text x="136" y="156" class="label center">Turn 终止决策</text>

  <!-- Start and cancellation -->
  <rect x="80" y="190" width="190" height="58" rx="13" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="175" y="215" class="title center white">queued → running</text><text x="175" y="237" class="meta center white">创建 AbortController</text>
  <path d="M270 219H337" class="purpleEdge"/>
  <polygon points="445,172 553,219 445,266 337,219" class="decision"/>
  <text x="445" y="212" class="title center">AbortSignal</text><text x="445" y="233" class="meta center">已触发？</text>
  <path d="M445 266V316" class="edge"/><text x="456" y="294" class="label">否</text>
  <rect x="329" y="317" width="232" height="62" rx="13" class="node"/>
  <text x="445" y="341" class="title center">构建上下文并调用模型</text><text x="445" y="365" class="meta center">流式解析文本、Tool Call 与 finishReason</text>

  <!-- Cancellation path -->
  <path d="M553 219H1021V711" class="edge"/><text x="574" y="205" class="label">是</text>
  <text x="765" y="206" class="meta center">模型、工具、命令和子 Agent 共享取消链</text>

  <!-- Model output decision -->
  <path d="M561 348H625" class="edge"/>
  <polygon points="752,291 879,348 752,405 625,348" class="decision"/>
  <text x="752" y="337" class="title center">模型流是否留下</text><text x="752" y="359" class="meta center">不可恢复错误？</text>
  <path d="M879 348H1107V952H189V935" class="redEdge"/><text x="898" y="334" class="labelRed">是</text>
  <text x="963" y="374" class="meta center">重试耗尽 / 协议错误</text>
  <path d="M752 405V446" class="edge"/><text x="763" y="428" class="label">否</text>

  <!-- Finish reason branches -->
  <polygon points="752,445 879,500 752,555 625,500" class="decision"/>
  <text x="752" y="491" class="title center">finishReason = length</text><text x="752" y="513" class="meta center">且没有 Tool Call？</text>
  <path d="M625 500H486" class="edge"/><text x="582" y="486" class="label">是</text>
  <rect x="260" y="463" width="226" height="74" rx="13" class="recover"/>
  <text x="373" y="488" class="title center">压缩并注入恢复提示</text><text x="373" y="511" class="meta center">避免重复长篇分析</text><text x="373" y="530" class="meta center">truncatedResponses + 1</text>
  <path d="M373 463V412H445V379" class="dashEdge"/>
  <text x="349" y="427" class="meta">少于 3 次：再请求</text>
  <path d="M260 500H188V843" class="redEdge"/><text x="203" y="486" class="labelRed">累计 3 次</text>

  <path d="M752 555V594" class="edge"/><text x="763" y="578" class="label">否</text>
  <polygon points="752,592 879,647 752,702 625,647" class="decision"/>
  <text x="752" y="638" class="title center">存在 Tool Call？</text><text x="752" y="660" class="meta center">callId 已完整聚合</text>

  <!-- Natural completion -->
  <path d="M625 647H495V843" class="purpleEdge"/><text x="576" y="633" class="label">否：自然文本</text>

  <!-- Tool execution -->
  <path d="M752 702V735" class="edge"/><text x="763" y="722" class="label">是</text>
  <rect x="626" y="736" width="252" height="70" rx="13" class="node"/>
  <text x="752" y="760" class="title center">顺序执行完整工具组</text><text x="752" y="782" class="meta center">Schema → 策略/审批 → 执行</text><text x="752" y="800" class="meta center">每个 ToolResult 都写回 Observation</text>
  <path d="M626 771H486" class="edge"/>
  <polygon points="374,721 486,771 374,821 262,771" class="decision"/>
  <text x="374" y="762" class="title center">finish 成功？</text><text x="374" y="784" class="meta center">工具返回 ok:true</text>
  <path d="M374 821V831H495V843" class="purpleEdge"/><text x="386" y="837" class="label">是</text>

  <!-- Ordinary tool result and no progress -->
  <path d="M262 771H112V590H260" class="edge"/><text x="211" y="757" class="label">否</text>
  <rect x="260" y="554" width="226" height="72" rx="13" class="observe"/>
  <text x="373" y="578" class="title center">普通 ToolResult</text><text x="373" y="601" class="meta center">成功、拒绝或失败都先回填模型</text><text x="373" y="620" class="meta center">失败才增加 noProgress</text>
  <path d="M260 590H212V668" class="edge"/>
  <polygon points="212,665 308,708 212,751 116,708" class="decision"/>
  <text x="212" y="700" class="title center">连续失败</text><text x="212" y="721" class="meta center">达到 3 次？</text>
  <path d="M116 708H76V826H188V843" class="redEdge"/><text x="82" y="694" class="labelRed">是</text>
  <path d="M212 751V826H640V886H663" class="edge"/><text x="224" y="772" class="label">否</text>

  <!-- Iteration boundary -->
  <path d="M486 590H575V826H758V843" class="edge"/><text x="496" y="577" class="label">成功</text>
  <polygon points="758,843 853,886 758,929 663,886" class="decision"/>
  <text x="758" y="878" class="title center">第 24 轮结束</text><text x="758" y="899" class="meta center">仍未 finished？</text>
  <path d="M758 843V827H445V379" class="dashEdge"/><text x="777" y="829" class="label">否：下一轮</text>
  <path d="M853 886H907" class="edge"/><text x="872" y="872" class="label">是</text>

  <!-- Terminal outcome cards -->
  <g transform="translate(64 843)">
    <rect width="250" height="92" rx="15" class="failed" filter="url(#shadow)"/>
    <circle cx="27" cy="27" r="15" fill="#d94b64"/><text x="27" y="28" class="badge white">×</text>
    <text x="52" y="30" class="title">failed</text><text x="22" y="57" class="mono">event: turn.failed</text><text x="22" y="78" class="meta">output_limit / no progress / error</text>
  </g>
  <g transform="translate(370 843)">
    <rect width="250" height="92" rx="15" class="complete" filter="url(#shadow)"/>
    <circle cx="27" cy="27" r="15" fill="#15966f"/><text x="27" y="28" class="badge white">✓</text>
    <text x="52" y="30" class="title">completed</text><text x="22" y="57" class="mono">event: turn.completed</text><text x="22" y="78" class="meta">自然文本或 finish 成功</text>
  </g>
  <g transform="translate(874 843)">
    <rect width="218" height="92" rx="15" class="limit" filter="url(#shadow)"/>
    <circle cx="27" cy="27" r="15" fill="#c68327"/><text x="27" y="28" class="badge white">24</text>
    <text x="52" y="30" class="title">limitReached</text><text x="22" y="57" class="mono">event: turn.failed</text><text x="22" y="78" class="meta">error: iteration_limit</text>
  </g>
  <g transform="translate(934 711)">
    <rect width="158" height="92" rx="15" class="cancel" filter="url(#shadow)"/>
    <circle cx="27" cy="27" r="15" fill="#756c7b"/><text x="27" y="28" class="badge white">■</text>
    <text x="52" y="30" class="title">cancelled</text><text x="18" y="57" class="mono">turn.cancelled</text><text x="18" y="78" class="meta">优先于其他错误</text>
  </g>

  <!-- Error classification panel -->
  <text x="1170" y="150" class="section">错误分层：先判断能否继续</text>
  <g transform="translate(1166 177)">
    <rect width="390" height="166" rx="17" class="card"/>
    <rect x="18" y="18" width="132" height="27" rx="13.5" fill="#e9f2fb"/><text x="84" y="36" class="meta center" style="fill:#3976c5;font-weight:700">步骤级 · 可恢复</text>
    <text x="18" y="73" class="title">ToolResult.error</text>
    <text x="18" y="98" class="body">参数无效、审批拒绝、路径拒绝、命令失败、</text>
    <text x="18" y="119" class="body">超时等，保留 code、message、retryable。</text>
    <text x="18" y="145" class="strong">默认回填 Observation，由模型调整下一步。</text>
  </g>
  <g transform="translate(1166 359)">
    <rect width="390" height="166" rx="17" class="card"/>
    <rect x="18" y="18" width="132" height="27" rx="13.5" fill="#fff0f3"/><text x="84" y="36" class="meta center" style="fill:#c73d57;font-weight:700">Turn 级 · 不可继续</text>
    <text x="18" y="73" class="title">AgentRunError</text>
    <text x="18" y="98" class="body">模型重试耗尽、协议/解析错误、output_limit、</text>
    <text x="18" y="119" class="body">iteration_limit；cancelled 单独映射取消终态。</text>
    <text x="18" y="145" class="strong">未知异常统一降为 turn_failed，避免假完成。</text>
  </g>
  <g transform="translate(1166 541)">
    <rect width="390" height="224" rx="17" class="card"/>
    <text x="20" y="32" class="title">按来源定位</text>
    <rect x="20" y="52" width="104" height="30" rx="15" fill="#f0e7fa"/><text x="72" y="71" class="meta center">用户 / 权限</text>
    <rect x="137" y="52" width="104" height="30" rx="15" fill="#e9f2fb"/><text x="189" y="71" class="meta center">模型 / 解析</text>
    <rect x="254" y="52" width="116" height="30" rx="15" fill="#fff4e8"/><text x="312" y="71" class="meta center">工具 / 超时</text>
    <rect x="20" y="93" width="104" height="30" rx="15" fill="#fff0f3"/><text x="72" y="112" class="meta center">系统 / 状态</text>
    <rect x="137" y="93" width="104" height="30" rx="15" fill="#f0eef2"/><text x="189" y="112" class="meta center">取消</text>
    <text x="20" y="155" class="body">来源帮助日志、Trace 和 UI 说明“哪里失败”；</text>
    <text x="20" y="177" class="body">真正的控制依据仍是稳定 error code 与状态机。</text>
    <line x1="20" y1="192" x2="370" y2="192" stroke="#e8e2eb"/>
    <text x="20" y="215" class="mono">error = { code, message, retryable }</text>
  </g>
  <g transform="translate(1166 781)">
    <rect width="390" height="154" rx="17" fill="#f0e7fa" stroke="#b99aef" stroke-width="1.5"/>
    <text x="20" y="31" class="title">为什么工具失败不立即终止？</text>
    <text x="20" y="58" class="body">文件冲突、测试失败和审批拒绝通常仍可换方案。</text>
    <text x="20" y="80" class="body">Core 把真实结果交还模型，成功会清零无进展计数；</text>
    <text x="20" y="102" class="body">只有连续三次没有成功工具，才保护性结束 Turn。</text>
    <text x="20" y="129" class="strong">因此：ToolResult ok:false ≠ turn.failed。</text>
  </g>

  <!-- Invariants -->
  <rect x="48" y="992" width="1504" height="76" rx="15" fill="#f0e7fa" stroke="#b99aef" stroke-width="1.5"/>
  <text x="70" y="1018" class="title">关键不变量</text>
  <text x="200" y="1018" class="mono">取消优先：AbortSignal 触发后不再执行已缓冲 Tool Call；finally 清理控制器、审批与活动 Turn 占用</text>
  <text x="200" y="1040" class="mono">completed 只来自自然文本或 finish 成功；length、迭代上限、连续失败和不可恢复错误不能冒充完成</text>
  <text x="200" y="1061" class="mono">limitReached 是 TurnStatus，对外仍发布 turn.failed；终态前运行 turnEnd Hook 并写入 completedAt</text>
</svg>
