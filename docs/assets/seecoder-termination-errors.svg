<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 终止条件与错误处理</title>
  <desc id="desc">TurnRunner 根据本轮结果选择完成、继续下一轮或结束任务。可恢复错误返回循环，失败、取消和达到限制进入终态。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#70488d"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#239474"/></marker>
    <marker id="arrowGold" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#c28a20"/></marker>
    <marker id="arrowRed" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#c84b62"/></marker>
  </defs>

  <rect width="1200" height="640" rx="28" fill="#faf9fc"/>
  <text x="40" y="43" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">每轮只做一次去向判断</text>
  <text x="40" y="71" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">完成则结束，可恢复问题进入下一轮，取消、严重错误和预算上限进入终态</text>

  <!-- 可恢复分支绕到节点上方，再返回 TurnRunner；线路不穿过任何节点。 -->
  <path d="M1130 290H1160V92H130V238" fill="none" stroke="#c28a20" stroke-width="2.6" marker-end="url(#arrowGold)"/>
  <text x="645" y="84" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Observation → 进入下一轮</text>

  <rect x="35" y="250" width="190" height="86" rx="18" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/>
  <text x="130" y="284" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">TurnRunner</text>
  <text x="130" y="310" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">检查文本、工具与运行状态</text>
  <path d="M225 293H288" fill="none" stroke="#70488d" stroke-width="2.8" marker-end="url(#arrow)"/>

  <path d="M455 190L610 290L455 390L300 290Z" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="455" y="282" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="700">本轮结果</text>
  <text x="455" y="309" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">完成、重试，还是停止？</text>

  <!-- 完成分支。 -->
  <path d="M455 190V150H688" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="700" y="110" width="430" height="80" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="915" y="142" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">completed</text>
  <text x="915" y="168" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">保存最终回答、摘要和验证状态</text>

  <!-- 可恢复分支。 -->
  <path d="M610 290H688" fill="none" stroke="#c28a20" stroke-width="2.8" marker-end="url(#arrowGold)"/>
  <rect x="700" y="235" width="430" height="110" rx="17" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/>
  <text x="915" y="268" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">继续下一轮</text>
  <text x="915" y="294" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">参数错误、测试失败或普通命令错误 → Observation</text>
  <text x="915" y="317" text-anchor="middle" fill="#887344" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">输出截断 → 压缩上下文后重试</text>

  <!-- 不可继续的结果汇聚到同一个终态区域。 -->
  <path d="M455 390V475H688" fill="none" stroke="#c84b62" stroke-width="2.8" marker-end="url(#arrowRed)"/>
  <rect x="700" y="415" width="430" height="120" rx="18" fill="#fff7f8" stroke="#d96b7f" stroke-width="2"/>
  <text x="915" y="445" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="700">结束本次 Turn</text>

  <rect x="720" y="460" width="120" height="54" rx="12" fill="#fff" stroke="#efb0bc"/>
  <text x="780" y="482" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">failed</text>
  <text x="780" y="501" text-anchor="middle" fill="#99606b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10">不可恢复错误</text>

  <rect x="855" y="460" width="120" height="54" rx="12" fill="#fff" stroke="#efb0bc"/>
  <text x="915" y="482" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">cancelled</text>
  <text x="915" y="501" text-anchor="middle" fill="#99606b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10">用户取消</text>

  <rect x="990" y="460" width="120" height="54" rx="12" fill="#fff" stroke="#efb0bc"/>
  <text x="1050" y="482" text-anchor="middle" fill="#a62f47" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="700">limitReached</text>
  <text x="1050" y="501" text-anchor="middle" fill="#99606b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10">达到迭代上限</text>

  <rect x="70" y="570" width="1060" height="44" rx="14" fill="#fff" stroke="#d8cfdf"/>
  <text x="600" y="597" text-anchor="middle" fill="#4f4456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">所有终态统一执行 turnEnd Hook、释放资源、持久化状态并通知界面</text>
</svg>
