<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 顶层工作方式</title>
  <desc id="desc">用户目标经过 Renderer 和 Preload 进入 Electron Main，AgentCore 装配 TurnRunner、Context、ToolCallExecutor 和 SessionStore。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#35134f" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#6d4c84"/></marker>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#faf9fc"/>
  <text x="42" y="46" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">从用户目标到受控本地执行</text>
  <text x="42" y="75" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">模型负责提出下一步，程序负责权限、执行、记录和停止</text>

  <rect x="40" y="145" width="165" height="130" rx="18" fill="#fff" stroke="#d8cfdf" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="122" cy="180" r="20" fill="#f0e7fb"/>
  <text x="122" y="187" text-anchor="middle" fill="#5d0cae" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="20">人</text>
  <text x="122" y="224" text-anchor="middle" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">用户目标</text>
  <text x="122" y="250" text-anchor="middle" fill="#867b8d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">选择工作区并描述任务</text>

  <path d="M205 210H258" fill="none" stroke="#6d4c84" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="270" y="145" width="165" height="130" rx="18" fill="#fff" stroke="#d8cfdf" stroke-width="2" filter="url(#shadow)"/>
  <text x="352" y="203" text-anchor="middle" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">Renderer</text>
  <text x="352" y="230" text-anchor="middle" fill="#867b8d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">对话、计划、审批</text>
  <text x="352" y="251" text-anchor="middle" fill="#867b8d" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Diff、终端、Trace</text>

  <path d="M435 210H488" fill="none" stroke="#6d4c84" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="500" y="145" width="150" height="130" rx="18" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2" filter="url(#shadow)"/>
  <text x="575" y="203" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="700">Preload</text>
  <text x="575" y="230" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">只暴露类型化 IPC</text>
  <text x="575" y="251" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">不开放 Node.js 权限</text>

  <path d="M650 210H698" fill="none" stroke="#6d4c84" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="710" y="100" width="450" height="230" rx="24" fill="#fff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="935" y="130" text-anchor="middle" fill="#5d0cae" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="700">Electron Main · 可信本地边界</text>
  <rect x="785" y="150" width="300" height="70" rx="16" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="935" y="181" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="700">AgentCore</text>
  <text x="935" y="203" text-anchor="middle" fill="#eadcff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">对外门面与依赖装配</text>

  <path d="M835 220L792 250" fill="none" stroke="#6d4c84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M935 220V250" fill="none" stroke="#6d4c84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <path d="M1035 220L1077 250" fill="none" stroke="#6d4c84" stroke-width="2.4" marker-end="url(#arrow)"/>
  <rect x="730" y="262" width="125" height="45" rx="11" fill="#f4edfb" stroke="#c9a8ea"/>
  <text x="792" y="289" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">TurnRunner</text>
  <rect x="872" y="262" width="125" height="45" rx="11" fill="#eef6ff" stroke="#9dc3e7"/>
  <text x="934" y="289" text-anchor="middle" fill="#285378" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">Context</text>
  <rect x="1015" y="262" width="125" height="45" rx="11" fill="#fff8e8" stroke="#e6c873"/>
  <text x="1077" y="282" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">ToolCall</text>
  <text x="1077" y="298" text-anchor="middle" fill="#6a5014" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12" font-weight="700">Executor</text>
  <text x="935" y="365" text-anchor="middle" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">SessionStore 持久化事件 · WorkspacePolicy 限制本地动作</text>
</svg>
