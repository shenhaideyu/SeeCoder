<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 产品与任务全景图</title>
  <desc id="desc">展示用户如何在三栏工作台中管理工作区和会话、与 Agent 对话、审批操作，并查看代码变更、文件、终端与轨迹；任务经过理解、计划、行动和验证，最终形成可见、可检查、可恢复的成果。</desc>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8247d6"/><stop offset="1" stop-color="#4d0099"/>
    </linearGradient>
    <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fbf8fe"/><stop offset="1" stop-color="#f1e8fa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#4d0099" flood-opacity=".10"/>
    </filter>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#4d0099"/></marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#15966f"/></marker>
    <style>
      .pageTitle{font:700 34px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#242027}
      .pageSubtitle{font:400 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#746d79}
      .section{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4d0099}
      .title{font:700 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#302737}
      .body{font:400 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#6d6475}
      .bodyStrong{font:600 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#4d4453}
      .meta{font:500 12px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#857b8c}
      .caps{font:700 11px 'Segoe UI','Microsoft YaHei',sans-serif;letter-spacing:1px;fill:#817688}
      .whiteTitle{font:700 18px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff}
      .whiteBody{font:400 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f5edfb}
      .card{fill:#fff;stroke:#e3dce8;stroke-width:1.5;filter:url(#shadow)}
      .softCard{fill:#fbf9fd;stroke:#ddd4e4;stroke-width:1.4}
      .purpleCard{fill:#f5eefb;stroke:#b99aef;stroke-width:1.5}
      .greenCard{fill:#eef9f5;stroke:#9bd8c5;stroke-width:1.5}
      .edge{fill:none;stroke:#4d0099;stroke-width:2.3;marker-end:url(#arrowPurple)}
      .resultEdge{fill:none;stroke:#15966f;stroke-width:2.3;marker-end:url(#arrowGreen)}
      .stepNo{font:700 16px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .mono{font:500 12px Consolas,'Microsoft YaHei',monospace;fill:#62596a}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f6f6f7"/>
  <text x="48" y="56" class="pageTitle">01 · 初识 SeeCoder：从任务到可验证代码</text>
  <text x="48" y="86" class="pageSubtitle">面向本地项目的可视化编程智能体：用户保留决策权，Agent 负责理解、执行、反馈与验证</text>

  <!-- User intent -->
  <g transform="translate(38 238)">
    <rect width="184" height="244" rx="24" fill="url(#brand)" filter="url(#shadow)"/>
    <circle cx="92" cy="52" r="24" fill="#fff" fill-opacity=".96"/>
    <circle cx="92" cy="45" r="8" fill="#8247d6"/>
    <path d="M75 67c4-10 10-15 17-15s13 5 17 15" fill="none" stroke="#8247d6" stroke-width="5" stroke-linecap="round"/>
    <text x="92" y="105" class="whiteTitle" text-anchor="middle">用户</text>
    <text x="92" y="132" class="whiteBody" text-anchor="middle">描述真实编程目标</text>
    <line x1="30" y1="153" x2="154" y2="153" stroke="#fff" stroke-opacity=".28"/>
    <text x="30" y="180" class="whiteBody">选择工作区</text>
    <text x="30" y="203" class="whiteBody">确认高风险操作</text>
    <text x="30" y="226" class="whiteBody">检查结果并追问</text>
  </g>
  <path d="M222 360H270" class="edge"/>
  <text x="246" y="346" class="bodyStrong" text-anchor="middle">任务</text>

  <!-- Three-column workbench -->
  <g>
    <rect x="270" y="122" width="954" height="566" rx="27" fill="#fff" stroke="#d9d2dd" stroke-width="2" filter="url(#shadow)"/>
    <rect x="270" y="122" width="954" height="62" rx="27" fill="#fbfafc"/>
    <path d="M270 160V184H1224V160" fill="#fbfafc"/>
    <line x1="270" y1="184" x2="1224" y2="184" stroke="#e5e1e8"/>
    <circle cx="301" cy="153" r="14" fill="url(#brand)"/>
    <text x="326" y="159" class="title">SeeCoder Workbench</text>
    <rect x="1042" y="138" width="72" height="30" rx="15" fill="#f0e7fa"/><text x="1078" y="158" class="meta" text-anchor="middle" style="fill:#4d0099;font-weight:700">Guided</text>
    <circle cx="1142" cy="153" r="5" fill="#36c98f"/><text x="1154" y="158" class="meta">就绪</text>

    <!-- Left rail -->
    <rect x="270" y="184" width="226" height="504" fill="#fbfafc"/>
    <line x1="496" y1="184" x2="496" y2="688" stroke="#e5e1e8"/>
    <text x="292" y="218" class="caps">WORKSPACE &amp; SESSION</text>
    <rect x="290" y="234" width="186" height="58" rx="12" class="purpleCard"/>
    <path d="M307 253h18l5 5h14v17h-37z" fill="none" stroke="#4d0099" stroke-width="2" stroke-linejoin="round"/>
    <text x="354" y="258" class="bodyStrong">当前工作区</text>
    <text x="354" y="278" class="meta">项目边界与规则</text>
    <rect x="290" y="310" width="186" height="42" rx="11" fill="url(#brand)"/>
    <text x="315" y="336" class="whiteBody">＋ 新建 Session</text>
    <text x="292" y="384" class="meta">最近任务</text>
    <rect x="290" y="397" width="186" height="49" rx="10" fill="#f0e7fa" stroke="#d2b8ea"/>
    <circle cx="309" cy="421" r="7" fill="#8247d6"/><text x="326" y="417" class="bodyStrong">修复登录校验</text><text x="326" y="436" class="meta">运行中 · 第 3 轮</text>
    <rect x="290" y="455" width="186" height="49" rx="10" class="softCard"/>
    <circle cx="309" cy="479" r="7" fill="#36c98f"/><text x="326" y="475" class="bodyStrong">补充筛选功能</text><text x="326" y="494" class="meta">已完成</text>
    <rect x="290" y="513" width="186" height="49" rx="10" class="softCard"/>
    <circle cx="309" cy="537" r="7" fill="#f2b84b"/><text x="326" y="533" class="bodyStrong">重构 API 调用</text><text x="326" y="552" class="meta">等待审批</text>
    <text x="292" y="603" class="body">搜索 · 重命名 · 置顶</text>
    <text x="292" y="626" class="body">归档 · 删除 · 切换项目</text>
    <rect x="290" y="648" width="186" height="22" rx="11" fill="#f3eff5"/><text x="383" y="664" class="meta" text-anchor="middle">历史按工作区隔离</text>

    <!-- Center conversation -->
    <rect x="496" y="184" width="450" height="504" fill="#fff"/>
    <line x1="946" y1="184" x2="946" y2="688" stroke="#e5e1e8"/>
    <text x="520" y="218" class="caps">CONVERSATION &amp; CONTROL</text>
    <rect x="520" y="236" width="402" height="66" rx="14" fill="#f0e7fa"/>
    <text x="542" y="261" class="bodyStrong">你</text><text x="575" y="261" class="body">修复空标题仍可提交的问题，并补充测试。</text>
    <text x="542" y="284" class="meta">目标进入当前 Turn；语言、附件和模式一并记录</text>
    <g transform="translate(520 320)">
      <circle cx="17" cy="17" r="17" fill="url(#brand)"/><text x="17" y="22" class="whiteBody" text-anchor="middle">S</text>
      <text x="48" y="14" class="bodyStrong">SeeCoder 正在执行</text><text x="48" y="35" class="meta">理解目标 → 定位文件 → 生成最小修改</text>
      <rect x="48" y="52" width="334" height="83" rx="11" class="softCard"/>
      <circle cx="67" cy="74" r="7" fill="#36c98f"/><text x="82" y="79" class="bodyStrong">已读取 4 个相关文件</text>
      <circle cx="67" cy="99" r="7" fill="#8247d6"/><text x="82" y="104" class="bodyStrong">正在应用补丁</text>
      <circle cx="67" cy="124" r="7" fill="#d8d1dc"/><text x="82" y="129" class="body">随后运行针对性测试</text>
    </g>
    <rect x="520" y="470" width="402" height="66" rx="13" fill="#fff8eb" stroke="#edc98e"/>
    <text x="542" y="495" class="bodyStrong">需要你的确认</text><text x="542" y="518" class="body">运行测试命令 · 查看风险与参数后允许或拒绝</text>
    <rect x="520" y="558" width="402" height="103" rx="15" fill="#fff" stroke="#d8d0dd" stroke-width="1.5"/>
    <text x="541" y="587" class="body">描述下一步任务或追加要求…</text>
    <line x1="540" y1="608" x2="902" y2="608" stroke="#eee9f1"/>
    <text x="541" y="638" class="meta">＋ 附件　Plan / Guided / Auto　模型</text>
    <circle cx="889" cy="635" r="18" fill="url(#brand)"/><path d="M881 635h15M890 627l8 8-8 8" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Right inspector -->
    <rect x="946" y="184" width="278" height="504" fill="#fbfafc"/>
    <text x="968" y="218" class="caps">INSPECTOR</text>
    <rect x="966" y="234" width="238" height="42" rx="10" fill="#f0e7fa"/>
    <text x="986" y="260" class="bodyStrong" style="fill:#4d0099">Changes</text><text x="1052" y="260" class="body">Files</text><text x="1092" y="260" class="body">Terminal</text><text x="1160" y="260" class="body">Trace</text>
    <rect x="966" y="294" width="238" height="106" rx="12" class="card"/>
    <text x="985" y="320" class="title">2 个文件发生变化</text>
    <text x="985" y="347" class="mono">src/form.ts       +8 −2</text>
    <text x="985" y="370" class="mono">tests/form.test.ts +12</text>
    <rect x="985" y="380" width="82" height="5" rx="2.5" fill="#36c98f"/><rect x="1071" y="380" width="26" height="5" rx="2.5" fill="#ff667d"/>
    <rect x="966" y="417" width="238" height="91" rx="12" class="card"/>
    <text x="985" y="443" class="title">Terminal</text><text x="985" y="469" class="mono">pnpm test form</text><circle cx="986" cy="489" r="6" fill="#36c98f"/><text x="1001" y="494" class="bodyStrong">8 tests passed</text>
    <rect x="966" y="525" width="238" height="118" rx="12" class="card"/>
    <text x="985" y="551" class="title">Trace</text>
    <line x1="991" y1="569" x2="991" y2="620" stroke="#b99aef" stroke-width="2"/>
    <circle cx="991" cy="575" r="6" fill="#8247d6"/><text x="1007" y="580" class="body">模型请求 · 1.8s</text>
    <circle cx="991" cy="598" r="6" fill="#8247d6"/><text x="1007" y="603" class="body">apply_patch · 已完成</text>
    <circle cx="991" cy="621" r="6" fill="#36c98f"/><text x="1007" y="626" class="body">验证通过 · Turn 完成</text>
    <text x="1085" y="671" class="meta" text-anchor="middle">过程默认摘要，细节按需展开</text>
  </g>

  <!-- Outcome -->
  <path d="M1224 360H1260" class="resultEdge"/>
  <g transform="translate(1260 208)">
    <rect width="300" height="305" rx="24" class="greenCard" filter="url(#shadow)"/>
    <circle cx="150" cy="54" r="30" fill="#15966f"/><path d="M136 54l9 9 20-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="150" y="108" class="title" text-anchor="middle">可见、可检查的成果</text>
    <rect x="24" y="132" width="252" height="44" rx="11" fill="#fff"/><text x="44" y="159" class="bodyStrong">代码修改</text><text x="252" y="159" class="meta" text-anchor="end">Diff / ChangeSet</text>
    <rect x="24" y="184" width="252" height="44" rx="11" fill="#fff"/><text x="44" y="211" class="bodyStrong">验证证据</text><text x="252" y="211" class="meta" text-anchor="end">命令 / 退出码</text>
    <rect x="24" y="236" width="252" height="44" rx="11" fill="#fff"/><text x="44" y="263" class="bodyStrong">可恢复记录</text><text x="252" y="263" class="meta" text-anchor="end">Session / Checkpoint</text>
  </g>

  <!-- Task stages -->
  <text x="48" y="744" class="section">一次任务的四个可观察阶段</text>
  <g transform="translate(48 770)">
    <rect width="337" height="118" rx="17" class="card"/>
    <circle cx="35" cy="34" r="19" fill="url(#brand)"/><text x="35" y="35" class="stepNo">1</text>
    <text x="67" y="33" class="title">理解</text><text x="67" y="57" class="body">保存目标、附件、语言与约束</text>
    <text x="22" y="88" class="meta">建立 Session / Turn，加载工作区规则</text><text x="22" y="107" class="meta">不在证据不足时直接修改</text>
  </g>
  <path d="M385 829H416" class="edge"/>
  <g transform="translate(416 770)">
    <rect width="337" height="118" rx="17" class="card"/>
    <circle cx="35" cy="34" r="19" fill="url(#brand)"/><text x="35" y="35" class="stepNo">2</text>
    <text x="67" y="33" class="title">计划</text><text x="67" y="57" class="body">定位范围，拆分可验证步骤</text>
    <text x="22" y="88" class="meta">计划状态随阶段更新；Plan 模式只读</text><text x="22" y="107" class="meta">不使用虚假的百分比进度</text>
  </g>
  <path d="M753 829H784" class="edge"/>
  <g transform="translate(784 770)">
    <rect width="337" height="118" rx="17" class="card"/>
    <circle cx="35" cy="34" r="19" fill="url(#brand)"/><text x="35" y="35" class="stepNo">3</text>
    <text x="67" y="33" class="title">行动</text><text x="67" y="57" class="body">调用受控工具读取、修改与运行</text>
    <text x="22" y="88" class="meta">写入前检查权限并创建恢复点</text><text x="22" y="107" class="meta">模型只提出请求，Main 才能执行</text>
  </g>
  <path d="M1121 829H1152" class="resultEdge"/>
  <g transform="translate(1152 770)">
    <rect width="400" height="118" rx="17" class="greenCard" filter="url(#shadow)"/>
    <circle cx="35" cy="34" r="19" fill="#15966f"/><text x="35" y="35" class="stepNo">4</text>
    <text x="67" y="33" class="title">验证</text><text x="67" y="57" class="body">根据真实测试结果修正或完成</text>
    <text x="22" y="88" class="meta">记录 revision、命令、退出码与摘要</text><text x="22" y="107" class="meta">验证过期会提示，不伪造成功证据</text>
  </g>

  <!-- Invariants -->
  <rect x="48" y="918" width="1504" height="54" rx="14" fill="#f0e7fa" stroke="#b99aef" stroke-width="1.5"/>
  <text x="70" y="941" class="title">关键不变量</text>
  <text x="200" y="941" class="mono">用户做决策 · Renderer 只负责交互 · Electron Main 是唯一可信执行边界 · 主 Agent 是唯一写入者</text>
  <text x="200" y="961" class="mono">每个结果都能追溯到 Session、Turn、模型请求、Tool Call 与真实验证；界面不展示模型私有思维链</text>
</svg>
