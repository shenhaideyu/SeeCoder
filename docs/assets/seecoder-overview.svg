<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 产品总览</title>
  <desc id="desc">用户在工作区和 Session 中提交目标，AgentCore 协调模型与本地工具，最终产生可检查的结果证据。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#32104f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#f8f7fa"/>
  <rect x="55" y="94" width="210" height="212" rx="22" fill="#fff" stroke="#d9c9e8" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="160" cy="142" r="30" fill="#f0e7fa"/><text x="160" y="151" text-anchor="middle" font-size="28" fill="#4d0099">人</text>
  <text x="160" y="205" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#241b2b">用户目标</text>
  <text x="160" y="240" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#746d79">选择工作区</text>
  <text x="160" y="270" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#746d79">创建 Session</text>

  <path d="M265 200H365" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="375" y="104" width="250" height="192" rx="24" fill="url(#brand)" filter="url(#shadow)"/>
  <text x="500" y="180" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="29" font-weight="700" fill="#fff">AgentCore</text>
  <text x="500" y="222" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#f4eefe">理解 · 计划 · 调度</text>
  <text x="500" y="255" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" fill="#f4eefe">控制任务闭环</text>

  <path d="M625 200H705" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="715" y="70" width="200" height="108" rx="20" fill="#eef5ff" stroke="#79a9ed" stroke-width="2"/>
  <text x="815" y="119" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#243a63">ModelProvider</text>
  <text x="815" y="150" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#5d6980">模型决策</text>
  <rect x="715" y="222" width="200" height="108" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2"/>
  <text x="815" y="271" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#5c4119">ToolRuntime</text>
  <text x="815" y="302" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" fill="#725d3b">受控本地执行</text>

  <path d="M915 200H985" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="995" y="104" width="155" height="192" rx="22" fill="#edf8f4" stroke="#63b89b" stroke-width="2" filter="url(#shadow)"/>
  <text x="1072" y="180" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#185b49">结果证据</text>
  <text x="1072" y="220" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#477366">Diff</text>
  <text x="1072" y="250" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" fill="#477366">测试 · 轨迹</text>
</svg>
