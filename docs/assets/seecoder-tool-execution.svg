<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 工具与本地执行</title>
  <desc id="desc">Tool Call 依次经过参数校验、权限审批和 ToolRuntime 执行，结果形成 ToolResult、Observation 和 ChangeSet。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="45" y="90" width="175" height="115" rx="20" fill="#f0e7fa" stroke="#b38add" stroke-width="2" filter="url(#shadow)"/>
    <text x="132" y="140" text-anchor="middle" font-size="23" font-weight="700" fill="#4d0099">Tool Call</text><text x="132" y="175" text-anchor="middle" font-size="15" fill="#675774">模型提出动作</text>
    <path d="M220 147H270" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="280" y="90" width="180" height="115" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="370" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#241b2b">参数校验</text><text x="370" y="175" text-anchor="middle" font-size="15" fill="#746d79">工具名 · 参数</text>
    <path d="M460 147H510" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="520" y="90" width="190" height="115" rx="20" fill="#eef5ff" stroke="#79a9ed" stroke-width="2"/>
    <text x="615" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#243a63">权限与审批</text><text x="615" y="175" text-anchor="middle" font-size="15" fill="#5d6980">模式 · 工作区边界</text>
    <path d="M710 147H760" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="770" y="90" width="190" height="115" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2" filter="url(#shadow)"/>
    <text x="865" y="140" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4119">ToolRuntime</text><text x="865" y="175" text-anchor="middle" font-size="15" fill="#725d3b">受控本地执行</text>
    <path d="M960 147H1010" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1020" y="90" width="140" height="115" rx="20" fill="#edf8f4" stroke="#63b89b" stroke-width="2"/>
    <text x="1090" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#185b49">ToolResult</text><text x="1090" y="175" text-anchor="middle" font-size="15" fill="#477366">完整结果</text>

    <path d="M1090 205V275H790" fill="none" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="565" y="270" width="215" height="100" rx="20" fill="#edf8f4" stroke="#63b89b" stroke-width="2"/>
    <text x="672" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#185b49">Observation</text><text x="672" y="345" text-anchor="middle" font-size="15" fill="#477366">反馈给下一轮模型</text>
    <path d="M1090 205V330H1010" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="285" width="200" height="85" rx="20" fill="#fff" stroke="#b38add" stroke-width="2"/>
    <text x="900" y="322" text-anchor="middle" font-size="21" font-weight="700" fill="#4d0099">ChangeSet</text><text x="900" y="350" text-anchor="middle" font-size="15" fill="#746d79">文件变更可检查</text>
  </g>
</svg>
