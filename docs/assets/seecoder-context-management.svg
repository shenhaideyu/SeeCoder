<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 上下文管理</title>
  <desc id="desc">ContextBuilder 从权威状态、代码证据和最近历史中构建有限工作视图，超预算时使用摘要与检索。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="440" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="50" y="55" width="230" height="108" rx="20" fill="#eef5ff" stroke="#79a9ed" stroke-width="2"/>
    <text x="165" y="102" text-anchor="middle" font-size="23" font-weight="700" fill="#243a63">ContextLedger</text><text x="165" y="136" text-anchor="middle" font-size="16" fill="#5d6980">目标 · 计划 · 错误 · 验证</text>
    <rect x="50" y="185" width="230" height="108" rx="20" fill="#edf8f4" stroke="#63b89b" stroke-width="2"/>
    <text x="165" y="232" text-anchor="middle" font-size="23" font-weight="700" fill="#185b49">Evidence</text><text x="165" y="266" text-anchor="middle" font-size="16" fill="#477366">当前代码与工具结果</text>
    <rect x="50" y="315" width="230" height="80" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2"/>
    <text x="165" y="350" text-anchor="middle" font-size="22" font-weight="700" fill="#241b2b">最近历史</text><text x="165" y="378" text-anchor="middle" font-size="15" fill="#746d79">完整协议组</text>

    <path d="M280 109H390V180" fill="none" stroke="#6d5a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M280 239H390" stroke="#6d5a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <path d="M280 355H390V285" fill="none" stroke="#6d5a7d" stroke-width="2.5" marker-end="url(#arrow)"/>
    <rect x="400" y="145" width="300" height="180" rx="26" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="550" y="220" text-anchor="middle" font-size="29" font-weight="700" fill="#fff">ContextBuilder</text><text x="550" y="260" text-anchor="middle" font-size="18" fill="#f4eefe">按优先级和预算组装</text><text x="550" y="294" text-anchor="middle" font-size="16" fill="#f4eefe">保护目标与工具协议</text>

    <path d="M700 235H790" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="160" width="330" height="150" rx="24" fill="#fff" stroke="#b38add" stroke-width="2" filter="url(#shadow)"/>
    <text x="965" y="220" text-anchor="middle" font-size="27" font-weight="700" fill="#4d0099">ModelRequest</text><text x="965" y="260" text-anchor="middle" font-size="17" fill="#746d79">有限 · 相关 · 协议完整</text>

    <rect x="470" y="360" width="510" height="55" rx="27" fill="#fff8e8" stroke="#e5ad45" stroke-width="2"/>
    <text x="725" y="394" text-anchor="middle" font-size="17" font-weight="700" fill="#72501f">超出预算：语义摘要 + 历史检索；原始 Session 历史保持不变</text>
    <path d="M550 325V350" stroke="#e5ad45" stroke-width="2.5" marker-end="url(#arrow)"/>
  </g>
</svg>
