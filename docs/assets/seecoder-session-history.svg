<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder Session 与历史</title>
  <desc id="desc">Workspace 包含多个 Session，Session 包含多个 Turn，执行事实以 AgentEvent 保存到 SessionStore 并用于恢复。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="55" y="88" width="205" height="120" rx="21" fill="#fff" stroke="#d9c9e8" stroke-width="2" filter="url(#shadow)"/>
    <text x="157" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#241b2b">Workspace</text><text x="157" y="177" text-anchor="middle" font-size="16" fill="#746d79">一个本地项目</text>
    <path d="M260 148H335" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="345" y="88" width="205" height="120" rx="21" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="447" y="140" text-anchor="middle" font-size="27" font-weight="700" fill="#fff">Session</text><text x="447" y="177" text-anchor="middle" font-size="16" fill="#f4eefe">连续对话与任务历史</text>
    <path d="M550 148H625" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="635" y="88" width="205" height="120" rx="21" fill="#eef5ff" stroke="#79a9ed" stroke-width="2" filter="url(#shadow)"/>
    <text x="737" y="140" text-anchor="middle" font-size="27" font-weight="700" fill="#243a63">Turn</text><text x="737" y="177" text-anchor="middle" font-size="16" fill="#5d6980">一次用户请求</text>
    <path d="M840 148H915" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="925" y="88" width="220" height="120" rx="21" fill="#edf8f4" stroke="#63b89b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1035" y="140" text-anchor="middle" font-size="25" font-weight="700" fill="#185b49">AgentEvent</text><text x="1035" y="177" text-anchor="middle" font-size="16" fill="#477366">按顺序记录事实</text>

    <path d="M1035 208V270H600" fill="none" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="415" y="268" width="370" height="92" rx="22" fill="#fff" stroke="#b38add" stroke-width="2" filter="url(#shadow)"/>
    <text x="600" y="310" text-anchor="middle" font-size="24" font-weight="700" fill="#4d0099">SessionStore</text><text x="600" y="340" text-anchor="middle" font-size="16" fill="#746d79">保存历史 · 重启恢复 · 不重放副作用</text>
    <path d="M415 314H245V220" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
    <text x="320" y="302" text-anchor="middle" font-size="15" fill="#675774">恢复界面与状态</text>
  </g>
</svg>
