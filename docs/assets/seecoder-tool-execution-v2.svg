<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 工具执行管线</title>
  <desc id="desc">Tool Call 经过注册表、参数校验、模式审批、Hook、写入协调与真实执行，形成 ToolResult、Observation 和可恢复变更。</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#70488d"/></marker>
    <marker id="arrowGreen" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L11 5.5L0 11Z" fill="#239474"/></marker>
  </defs>
  <rect width="1200" height="600" rx="28" fill="#faf9fc"/>
  <text x="40" y="43" fill="#251d2b" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">模型请求必须穿过同一条本地执行管线</text>
  <text x="40" y="71" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">权限、Hook、锁、超时和结果记录由程序负责，不由模型自行决定</text>

  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="25" y="120" width="140" height="78" rx="16" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="95" y="152" text-anchor="middle" fill="#4d176f" font-size="16" font-weight="700">Tool Call</text><text x="95" y="176" text-anchor="middle" fill="#796488" font-size="11">name、args、callId</text>
    <rect x="200" y="120" width="145" height="78" rx="16" fill="#fff" stroke="#d8cfdf" stroke-width="2"/><text x="272" y="152" text-anchor="middle" fill="#251d2b" font-size="15" font-weight="700">Registry 与 Zod</text><text x="272" y="176" text-anchor="middle" fill="#867b8d" font-size="11">名称和参数校验</text>
    <rect x="380" y="120" width="150" height="78" rx="16" fill="#eef6ff" stroke="#8bb9df" stroke-width="2"/><text x="455" y="152" text-anchor="middle" fill="#285378" font-size="15" font-weight="700">模式与审批</text><text x="455" y="176" text-anchor="middle" fill="#61788c" font-size="11">Plan / Guided / Auto</text>
    <rect x="565" y="120" width="135" height="78" rx="16" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/><text x="632" y="152" text-anchor="middle" fill="#4d176f" font-size="15" font-weight="700">preToolUse</text><text x="632" y="176" text-anchor="middle" fill="#796488" font-size="11">可信 Hook 门禁</text>
    <rect x="735" y="105" width="205" height="108" rx="18" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/><text x="837" y="143" text-anchor="middle" fill="#6a5014" font-size="16" font-weight="700">MutationCoordinator</text><text x="837" y="168" text-anchor="middle" fill="#887344" font-size="11">读取可并行、文件按路径加锁</text><text x="837" y="188" text-anchor="middle" fill="#887344" font-size="11">命令独占整个工作区</text>
    <rect x="975" y="120" width="190" height="78" rx="16" fill="#fff8e8" stroke="#e0bd5d" stroke-width="2"/><text x="1070" y="152" text-anchor="middle" fill="#6a5014" font-size="16" font-weight="700">执行真实工具</text><text x="1070" y="176" text-anchor="middle" fill="#887344" font-size="11">超时、取消、流式输出</text>
  </g>
  <path d="M165 159H188" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M345 159H368" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M530 159H553" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M700 159H723" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>
  <path d="M940 159H963" fill="none" stroke="#70488d" stroke-width="2.7" marker-end="url(#arrow)"/>

  <path d="M1070 198V258" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="940" y="270" width="260" height="82" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="1070" y="302" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ToolResult</text>
  <text x="1070" y="327" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">ok / output / error / durationMs</text>

  <path d="M940 311H782" fill="none" stroke="#239474" stroke-width="2.8" marker-end="url(#arrowGreen)"/>
  <rect x="525" y="270" width="245" height="82" rx="17" fill="#f1fbf8" stroke="#79c7b2" stroke-width="2"/>
  <text x="647" y="302" text-anchor="middle" fill="#176a55" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">Observation</text>
  <text x="647" y="327" text-anchor="middle" fill="#5f8177" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">紧凑结果返回下一轮模型</text>

  <path d="M1070 352V407H907" fill="none" stroke="#70488d" stroke-width="2.6" marker-end="url(#arrow)"/>
  <rect x="650" y="380" width="245" height="82" rx="17" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/>
  <text x="772" y="412" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">ChangeSet 与 Checkpoint</text>
  <text x="772" y="437" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">修改前后哈希、快照与恢复证据</text>
  <path d="M650 421H492" fill="none" stroke="#70488d" stroke-width="2.6" marker-end="url(#arrow)"/>
  <rect x="250" y="380" width="230" height="82" rx="17" fill="#f4edfb" stroke="#b685dd" stroke-width="2"/>
  <text x="365" y="412" text-anchor="middle" fill="#4d176f" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="700">postFileEdit Hook</text>
  <text x="365" y="437" text-anchor="middle" fill="#796488" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">格式化、检查或项目自定义命令</text>

  <rect x="80" y="505" width="1040" height="52" rx="15" fill="#fff" stroke="#d8cfdf"/>
  <text x="600" y="527" text-anchor="middle" fill="#4f4456" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="700">统一错误边界</text>
  <text x="600" y="547" text-anchor="middle" fill="#786d80" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">未知工具、参数错误、审批拒绝、Hook 阻止、路径越界、超时和异常都转换为结构化结果，不直接击穿 TurnRunner</text>
</svg>
