<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">SeeCoder 单次任务流程</title>
  <desc id="desc">用户请求从 Renderer 进入 AgentCore，经过上下文构建、模型决策、本地工具和验证后形成事件与结果。</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4d0099"/><stop offset="1" stop-color="#7c3aed"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#6d5a7d"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#32104f" flood-opacity=".11"/></filter>
  </defs>
  <rect width="1200" height="430" rx="28" fill="#f8f7fa"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <rect x="50" y="135" width="175" height="110" rx="20" fill="#fff" stroke="#d9c9e8" stroke-width="2" filter="url(#shadow)"/>
    <text x="137" y="185" text-anchor="middle" font-size="23" font-weight="700" fill="#241b2b">Renderer</text><text x="137" y="218" text-anchor="middle" font-size="16" fill="#746d79">提交用户目标</text>
    <path d="M225 190H285" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="295" y="118" width="190" height="144" rx="22" fill="url(#brand)" filter="url(#shadow)"/>
    <text x="390" y="180" text-anchor="middle" font-size="25" font-weight="700" fill="#fff">AgentCore</text><text x="390" y="216" text-anchor="middle" font-size="16" fill="#f4eefe">创建 Turn · 控制循环</text>
    <rect x="305" y="302" width="170" height="82" rx="18" fill="#f0e7fa" stroke="#b38add" stroke-width="2"/>
    <text x="390" y="338" text-anchor="middle" font-size="20" font-weight="700" fill="#4d0099">ContextBuilder</text><text x="390" y="366" text-anchor="middle" font-size="15" fill="#675774">构建工作视图</text>
    <path d="M390 262V294" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>

    <path d="M485 190H545" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="555" y="135" width="180" height="110" rx="20" fill="#eef5ff" stroke="#79a9ed" stroke-width="2" filter="url(#shadow)"/>
    <text x="645" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#243a63">ModelProvider</text><text x="645" y="218" text-anchor="middle" font-size="16" fill="#5d6980">生成文本或 Tool Call</text>

    <path d="M735 190H795" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="805" y="135" width="170" height="110" rx="20" fill="#fff8e8" stroke="#e5ad45" stroke-width="2" filter="url(#shadow)"/>
    <text x="890" y="185" text-anchor="middle" font-size="22" font-weight="700" fill="#5c4119">ToolRuntime</text><text x="890" y="218" text-anchor="middle" font-size="16" fill="#725d3b">执行并返回结果</text>

    <path d="M975 190H1030" stroke="#6d5a7d" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="1040" y="118" width="120" height="144" rx="22" fill="#edf8f4" stroke="#63b89b" stroke-width="2" filter="url(#shadow)"/>
    <text x="1100" y="180" text-anchor="middle" font-size="21" font-weight="700" fill="#185b49">验证完成</text><text x="1100" y="215" text-anchor="middle" font-size="15" fill="#477366">AgentEvent</text>

    <path d="M890 260V340H495" fill="none" stroke="#1f9d78" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="700" y="330" text-anchor="middle" font-size="16" fill="#18775d">Observation 返回下一轮</text>
  </g>
</svg>
