<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
  <title id="title">子 Session 可见历史的拼接过程</title>
  <desc id="desc">读取父事件一到五后按分叉位置三过滤，保留一到三，再与子分支新增事件四撇和五撇合并。</desc>
  <style>
    .bg{fill:#fbf9fd}.box{fill:#fff;stroke:#d8cde2;stroke-width:2}.keep{fill:#f1e9fb;stroke:#8247d6;stroke-width:2}.drop{fill:#f4f2f5;stroke:#c9c2ce;stroke-width:2}.child{fill:#eaf8f3;stroke:#269c76;stroke-width:2}.result{fill:#fff;stroke:#8247d6;stroke-width:3}.title{font:700 22px 'Microsoft YaHei',sans-serif;fill:#252127}.label{font:600 16px 'Microsoft YaHei',sans-serif;fill:#252127}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.faded{fill:#9a929f}.arrow{stroke:#8c7c99;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8c7c99"/></marker></defs>
  <rect class="bg" width="1120" height="600" rx="26"/><text class="title" x="60" y="58">readEvents(子 Session) 怎样得到完整历史</text>
  <rect class="box" x="60" y="100" width="300" height="205" rx="16"/><text class="label" x="85" y="135">① 读取父分支</text>
  <g transform="translate(86 172)"><circle class="keep" cx="24" cy="24" r="23"/><circle class="keep" cx="76" cy="24" r="23"/><circle class="keep" cx="128" cy="24" r="23"/><circle class="drop" cx="180" cy="24" r="23"/><circle class="drop" cx="232" cy="24" r="23"/><text class="label" x="24" y="30" text-anchor="middle">1</text><text class="label" x="76" y="30" text-anchor="middle">2</text><text class="label" x="128" y="30" text-anchor="middle">3</text><text class="label faded" x="180" y="30" text-anchor="middle">4</text><text class="label faded" x="232" y="30" text-anchor="middle">5</text></g>
  <text class="small" x="85" y="257">分叉位置 = 3，因此丢弃 4、5</text>
  <rect class="box" x="410" y="100" width="300" height="205" rx="16"/><text class="label" x="435" y="135">② 读取子分支自身</text>
  <g transform="translate(489 172)"><circle class="child" cx="24" cy="24" r="23"/><circle class="child" cx="92" cy="24" r="23"/><text class="label" x="24" y="30" text-anchor="middle">4′</text><text class="label" x="92" y="30" text-anchor="middle">5′</text></g>
  <text class="small" x="435" y="257">这里只读取子目录的 events.jsonl</text>
  <path class="arrow" d="M360 202H402"/><path class="arrow" d="M710 202H752"/>
  <rect class="result" x="760" y="100" width="300" height="205" rx="16"/><text class="label" x="785" y="135">③ 合并并排序</text>
  <g transform="translate(785 172)"><circle class="keep" cx="24" cy="24" r="22"/><circle class="keep" cx="74" cy="24" r="22"/><circle class="keep" cx="124" cy="24" r="22"/><circle class="child" cx="180" cy="24" r="22"/><circle class="child" cx="236" cy="24" r="22"/><text class="label" x="24" y="30" text-anchor="middle">1</text><text class="label" x="74" y="30" text-anchor="middle">2</text><text class="label" x="124" y="30" text-anchor="middle">3</text><text class="label" x="180" y="30" text-anchor="middle">4′</text><text class="label" x="236" y="30" text-anchor="middle">5′</text></g>
  <text class="small" x="785" y="257">这是子 Session 的可见历史</text>
  <rect x="115" y="370" width="890" height="150" rx="18" fill="#f3eef8" stroke="#d8cde2" stroke-width="2"/>
  <text class="title" x="560" y="411" text-anchor="middle">关键结果</text>
  <text class="label" x="560" y="451" text-anchor="middle">父分支的 4、5 没有被删除，只是对子分支不可见</text>
  <text class="label" x="560" y="484" text-anchor="middle">完整历史在读取时计算；磁盘上没有第二份 1、2、3</text>
</svg>
