<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title">
  <title id="title">Session 增量分支</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#8247d6;stroke-width:3}.c{fill:#eefaf6;stroke:#31a77c;stroke-width:3}.t{font:600 18px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.l{stroke:#8247d6;stroke-width:4;fill:none}.d{stroke:#31a77c;stroke-width:4;fill:none}</style><rect class="bg" width="1080" height="500" rx="24"/>
  <text class="t" x="70" y="65">父分支</text><path class="l" d="M140 150H820"/><circle class="n" cx="180" cy="150" r="34"/><circle class="n" cx="380" cy="150" r="34"/><circle class="n" cx="580" cy="150" r="34"/><circle class="n" cx="780" cy="150" r="34"/><text class="t" x="180" y="156" text-anchor="middle">1</text><text class="t" x="380" y="156" text-anchor="middle">2</text><text class="t" x="580" y="156" text-anchor="middle">3</text><text class="t" x="780" y="156" text-anchor="middle">4</text>
  <path class="d" d="M380 184V315H820"/><circle class="c" cx="580" cy="315" r="34"/><circle class="c" cx="780" cy="315" r="34"/><text class="t" x="580" y="321" text-anchor="middle">3′</text><text class="t" x="780" y="321" text-anchor="middle">4′</text><text class="t" x="70" y="320">子分支</text>
  <rect x="865" y="105" width="165" height="90" rx="14" fill="#f1e8fb" stroke="#d8c0ef" stroke-width="2"/><text class="t" x="947" y="140" text-anchor="middle">父分支继续</text><text class="s" x="947" y="168" text-anchor="middle">不会进入子分支</text>
  <rect x="865" y="270" width="165" height="90" rx="14" fill="#eefaf6" stroke="#31a77c" stroke-width="2"/><text class="t" x="947" y="305" text-anchor="middle">只保存增量</text><text class="s" x="947" y="333" text-anchor="middle">不复制父 JSONL</text>
  <text class="s" x="380" y="415" text-anchor="middle">forkedFromSeq = 2：子分支继承 1、2，只追加 3′、4′</text><text class="s" x="540" y="452" text-anchor="middle">Rewind 也是创建新分支；原分支不会被删除</text>
</svg>
