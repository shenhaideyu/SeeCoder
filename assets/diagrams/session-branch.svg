<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540" role="img" aria-labelledby="title desc">
  <title id="title">Session 在第三个事件处分叉</title>
  <desc id="desc">父分支包含事件一到五，子分支继承事件一到三，再产生自己的事件四撇和五撇。</desc>
  <style>
    .bg{fill:#fbf9fd}.line{stroke:#8247d6;stroke-width:5;fill:none;stroke-linecap:round}.child-line{stroke:#269c76;stroke-width:5;fill:none;stroke-linecap:round}.parent{fill:#fff;stroke:#8247d6;stroke-width:3}.child{fill:#effaf6;stroke:#269c76;stroke-width:3}.muted{fill:#f3eef8;stroke:#cbb9dc;stroke-width:2}.title{font:700 22px 'Microsoft YaHei',sans-serif;fill:#252127}.label{font:600 17px 'Microsoft YaHei',sans-serif;fill:#252127}.small{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.white{fill:#fff}
  </style>
  <rect class="bg" width="1120" height="540" rx="26"/>
  <text class="title" x="62" y="58">从事件 3 创建新路线</text>
  <text class="label" x="62" y="145">父 Session</text>
  <path class="line" d="M215 140H925"/>
  <circle class="parent" cx="255" cy="140" r="34"/><circle class="parent" cx="415" cy="140" r="34"/><circle class="parent" cx="575" cy="140" r="34"/><circle class="parent" cx="735" cy="140" r="34"/><circle class="parent" cx="895" cy="140" r="34"/>
  <text class="label" x="255" y="146" text-anchor="middle">1</text><text class="label" x="415" y="146" text-anchor="middle">2</text><text class="label" x="575" y="146" text-anchor="middle">3</text><text class="label" x="735" y="146" text-anchor="middle">4</text><text class="label" x="895" y="146" text-anchor="middle">5</text>
  <path class="child-line" d="M575 176V322H925"/>
  <text class="label" x="62" y="328">子 Session</text>
  <circle class="child" cx="735" cy="322" r="34"/><circle class="child" cx="895" cy="322" r="34"/>
  <text class="label" x="735" y="328" text-anchor="middle">4′</text><text class="label" x="895" y="328" text-anchor="middle">5′</text>
  <rect class="muted" x="220" y="410" width="375" height="78" rx="14"/><text class="label" x="407" y="442" text-anchor="middle">继承并固定：1、2、3</text><text class="small" x="407" y="469" text-anchor="middle">父分支以后新增内容也不会进入子分支</text>
  <rect class="child" x="625" y="410" width="330" height="78" rx="14"/><text class="label" x="790" y="442" text-anchor="middle">子分支新增：4′、5′</text><text class="small" x="790" y="469" text-anchor="middle">原来的 4、5 仍保留在父分支</text>
</svg>
