<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="540" viewBox="0 0 1080 540" role="img" aria-labelledby="title">
  <title id="title">工具执行与 Workspace 写入协调</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#d8c0ef;stroke-width:2}.p{fill:#f1e8fb;stroke:#8247d6;stroke-width:3}.ok{fill:#eefaf6;stroke:#31a77c;stroke-width:2}.t{font:600 18px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.a{stroke:#8247d6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8247d6"/></marker></defs><rect class="bg" width="1080" height="540" rx="24"/>
  <rect class="p" x="60" y="70" width="210" height="90" rx="16"/><text class="t" x="165" y="108" text-anchor="middle">ToolCallExecutor</text><text class="s" x="165" y="135" text-anchor="middle">工具调用统一入口</text>
  <rect class="n" x="340" y="45" width="210" height="70" rx="14"/><text class="t" x="445" y="86" text-anchor="middle">参数与幂等检查</text><rect class="n" x="340" y="135" width="210" height="70" rx="14"/><text class="t" x="445" y="176" text-anchor="middle">模式、审批、拦截器</text><rect class="n" x="340" y="225" width="210" height="70" rx="14"/><text class="t" x="445" y="266" text-anchor="middle">超时与异常归一化</text>
  <rect class="p" x="625" y="105" width="350" height="130" rx="18"/><text class="t" x="800" y="145" text-anchor="middle">WorkspaceMutationCoordinator</text><text class="s" x="800" y="177" text-anchor="middle">同一文件：排队执行</text><text class="s" x="800" y="204" text-anchor="middle">不同文件：可以并行</text>
  <rect class="ok" x="90" y="365" width="250" height="90" rx="16"/><text class="t" x="215" y="403" text-anchor="middle">只读工具</text><text class="s" x="215" y="430" text-anchor="middle">全部 parallelSafe 才并行</text>
  <rect class="ok" x="415" y="365" width="250" height="90" rx="16"/><text class="t" x="540" y="403" text-anchor="middle">文件写入 / Patch</text><text class="s" x="540" y="430" text-anchor="middle">按目标文件加锁</text>
  <rect class="ok" x="740" y="365" width="250" height="90" rx="16"/><text class="t" x="865" y="403" text-anchor="middle">run_command</text><text class="s" x="865" y="430" text-anchor="middle">写入范围未知，锁整个项目</text>
  <path class="a" d="M270 115H340"/><path class="a" d="M550 170H625"/><path class="a" d="M800 235V320H215V365"/><path class="a" d="M800 320H540V365"/><path class="a" d="M800 320H865V365"/><text class="s" x="540" y="505" text-anchor="middle">锁在 finally 中释放；工具失败、超时或取消都不会留下死锁</text>
</svg>
