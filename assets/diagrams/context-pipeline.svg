<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title">
  <title id="title">上下文构建管线</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#d8c0ef;stroke-width:2}.p{fill:#f1e8fb;stroke:#8247d6;stroke-width:3}.t{font:600 19px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.a{stroke:#8247d6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8247d6"/></marker></defs><rect class="bg" width="1080" height="520" rx="24"/>
  <text class="t" x="70" y="60">完整历史仍在磁盘</text><rect class="n" x="60" y="85" width="210" height="80" rx="14"/><text class="t" x="165" y="120" text-anchor="middle">Session 事件</text><text class="s" x="165" y="145" text-anchor="middle">审计与恢复来源</text>
  <rect class="n" x="60" y="210" width="210" height="80" rx="14"/><text class="t" x="165" y="245" text-anchor="middle">ContextLedger</text><text class="s" x="165" y="270" text-anchor="middle">目标、计划、变更、验证</text>
  <rect class="n" x="60" y="335" width="210" height="80" rx="14"/><text class="t" x="165" y="370" text-anchor="middle">Evidence / Memory</text><text class="s" x="165" y="395" text-anchor="middle">代码证据与相关旧事实</text>
  <rect class="p" x="370" y="170" width="270" height="165" rx="18"/><text class="t" x="505" y="210" text-anchor="middle">buildHybridContext</text><text class="s" x="505" y="242" text-anchor="middle">① 估算真实输入预算</text><text class="s" x="505" y="270" text-anchor="middle">② 先做免费裁剪</text><text class="s" x="505" y="298" text-anchor="middle">③ 必要时生成语义摘要</text>
  <rect class="n" x="735" y="85" width="280" height="80" rx="14"/><text class="t" x="875" y="120" text-anchor="middle">权威事实</text><text class="s" x="875" y="145" text-anchor="middle">永远优先，不被摘要覆盖</text>
  <rect class="n" x="735" y="210" width="280" height="80" rx="14"/><text class="t" x="875" y="245" text-anchor="middle">最近完整消息组</text><text class="s" x="875" y="270" text-anchor="middle">工具请求与结果保持配对</text>
  <rect class="n" x="735" y="335" width="280" height="80" rx="14"/><text class="t" x="875" y="370" text-anchor="middle">旧历史摘要</text><text class="s" x="875" y="395" text-anchor="middle">失败时使用确定性回退</text>
  <path class="a" d="M270 125C330 125 330 210 370 220"/><path class="a" d="M270 250H370"/><path class="a" d="M270 375C330 375 330 300 370 290"/><path class="a" d="M640 215C690 190 690 125 735 125"/><path class="a" d="M640 252H735"/><path class="a" d="M640 290C690 315 690 375 735 375"/><text class="s" x="540" y="470" text-anchor="middle">模型只接收“当前任务需要的视图”，不会直接吞下全部历史</text>
</svg>
