<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title">
  <title id="title">Steering 与 Follow-up 的生效位置</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#d8c0ef;stroke-width:2}.p{fill:#f1e8fb;stroke:#8247d6;stroke-width:3}.w{fill:#fff7e8;stroke:#d79a27;stroke-width:2}.t{font:600 18px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.a{stroke:#8247d6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8247d6"/></marker></defs><rect class="bg" width="1080" height="520" rx="24"/>
  <rect class="p" x="60" y="60" width="220" height="90" rx="16"/><text class="t" x="170" y="98" text-anchor="middle">运行中的 Turn</text><text class="s" x="170" y="126" text-anchor="middle">模型或工具正在工作</text>
  <rect class="w" x="60" y="345" width="220" height="90" rx="16"/><text class="t" x="170" y="383" text-anchor="middle">用户新消息</text><text class="s" x="170" y="411" text-anchor="middle">先进入干预队列</text>
  <rect class="n" x="385" y="325" width="260" height="130" rx="16"/><text class="t" x="515" y="363" text-anchor="middle">InterventionQueue</text><text class="s" x="515" y="394" text-anchor="middle">pending → consumed</text><text class="s" x="515" y="422" text-anchor="middle">取消时可变为 discarded</text>
  <rect class="p" x="760" y="55" width="250" height="110" rx="16"/><text class="t" x="885" y="94" text-anchor="middle">Steering</text><text class="s" x="885" y="125" text-anchor="middle">下一次模型请求前注入</text>
  <rect class="p" x="760" y="345" width="250" height="110" rx="16"/><text class="t" x="885" y="384" text-anchor="middle">Follow-up</text><text class="s" x="885" y="415" text-anchor="middle">当前 Turn 结束后启动新 Turn</text>
  <path class="a" d="M280 390H385"/><path class="a" d="M645 365C700 330 720 150 760 110"/><path class="a" d="M645 415H760"/><path class="a" d="M280 105H760"/><text class="s" x="525" y="92" text-anchor="middle">安全边界：不修改正在发送的消息数组</text>
</svg>
