<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="520" viewBox="0 0 1080 520" role="img" aria-labelledby="title">
  <title id="title">工具失败、任务失败与取消的处理层次</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#d8c0ef;stroke-width:2}.p{fill:#f1e8fb;stroke:#8247d6;stroke-width:3}.ok{fill:#eefaf6;stroke:#31a77c;stroke-width:2}.bad{fill:#fff1f1;stroke:#d85c5c;stroke-width:2}.t{font:600 18px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.a{stroke:#8247d6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8247d6"/></marker></defs><rect class="bg" width="1080" height="520" rx="24"/>
  <rect class="p" x="60" y="195" width="220" height="110" rx="16"/><text class="t" x="170" y="237" text-anchor="middle">出现异常或停止信号</text><text class="s" x="170" y="269" text-anchor="middle">先判断影响范围</text>
  <rect class="n" x="395" y="45" width="270" height="110" rx="16"/><text class="t" x="530" y="87" text-anchor="middle">单次工具失败</text><text class="s" x="530" y="119" text-anchor="middle">返回结构化结果，允许模型修复</text>
  <rect class="bad" x="395" y="205" width="270" height="110" rx="16"/><text class="t" x="530" y="247" text-anchor="middle">无法可靠继续</text><text class="s" x="530" y="279" text-anchor="middle">Turn 进入失败或达到限制</text>
  <rect class="n" x="395" y="365" width="270" height="110" rx="16"/><text class="t" x="530" y="407" text-anchor="middle">用户取消</text><text class="s" x="530" y="439" text-anchor="middle">同一信号中断模型、工具和等待</text>
  <rect class="ok" x="790" y="205" width="230" height="110" rx="16"/><text class="t" x="905" y="247" text-anchor="middle">统一收尾</text><text class="s" x="905" y="279" text-anchor="middle">写事件、释放锁和清理等待</text>
  <path class="a" d="M280 250C330 250 340 100 395 100"/><path class="a" d="M280 250H395"/><path class="a" d="M280 250C330 250 340 420 395 420"/><path class="a" d="M665 100C730 100 735 240 790 250"/><path class="a" d="M665 260H790"/><path class="a" d="M665 420C730 420 735 280 790 270"/>
</svg>
