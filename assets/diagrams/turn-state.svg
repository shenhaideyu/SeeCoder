<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title">
  <title id="title">Turn 状态机</title><style>.bg{fill:#fbf9fd}.n{fill:#fff;stroke:#d8c0ef;stroke-width:2}.p{fill:#f1e8fb;stroke:#8247d6;stroke-width:3}.ok{fill:#eefaf6;stroke:#31a77c;stroke-width:2}.bad{fill:#fff2f4;stroke:#c7485e;stroke-width:2}.t{font:600 20px 'Microsoft YaHei',sans-serif;fill:#252127}.s{font:14px 'Microsoft YaHei',sans-serif;fill:#675e6d}.a{stroke:#8247d6;stroke-width:3;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#8247d6"/></marker></defs>
  <rect class="bg" width="1080" height="500" rx="24"/><rect class="n" x="50" y="185" width="160" height="90" rx="45"/><text class="t" x="130" y="225" text-anchor="middle">queued</text><text class="s" x="130" y="250" text-anchor="middle">等待启动</text>
  <rect class="p" x="290" y="185" width="190" height="90" rx="18"/><text class="t" x="385" y="225" text-anchor="middle">running</text><text class="s" x="385" y="250" text-anchor="middle">模型与工具循环</text>
  <rect class="n" x="570" y="55" width="200" height="85" rx="18"/><text class="t" x="670" y="92" text-anchor="middle">waitingApproval</text><text class="s" x="670" y="117" text-anchor="middle">等待用户批准</text>
  <rect class="n" x="570" y="185" width="200" height="85" rx="18"/><text class="t" x="670" y="222" text-anchor="middle">waitingInput</text><text class="s" x="670" y="247" text-anchor="middle">等待补充信息</text>
  <rect class="ok" x="850" y="40" width="180" height="85" rx="18"/><text class="t" x="940" y="78" text-anchor="middle">completed</text><text class="s" x="940" y="103" text-anchor="middle">正常结束</text>
  <rect class="bad" x="850" y="150" width="180" height="85" rx="18"/><text class="t" x="940" y="188" text-anchor="middle">failed</text><text class="s" x="940" y="213" text-anchor="middle">发生错误</text>
  <rect class="bad" x="850" y="260" width="180" height="85" rx="18"/><text class="t" x="940" y="298" text-anchor="middle">cancelled</text><text class="s" x="940" y="323" text-anchor="middle">用户取消</text>
  <rect class="bad" x="850" y="370" width="180" height="85" rx="18"/><text class="t" x="940" y="408" text-anchor="middle">limitReached</text><text class="s" x="940" y="433" text-anchor="middle">达到轮数上限</text>
  <path class="a" d="M210 230H290"/><path class="a" d="M480 210C525 160 525 98 570 98"/><path class="a" d="M570 125C525 155 525 200 480 220"/><path class="a" d="M480 230H570"/><path class="a" d="M570 255C525 275 525 255 480 240"/><path class="a" d="M480 205C650 20 760 82 850 82"/><path class="a" d="M480 225C650 190 750 192 850 192"/><path class="a" d="M480 245C650 290 750 302 850 302"/><path class="a" d="M480 260C650 405 750 412 850 412"/>
</svg>
